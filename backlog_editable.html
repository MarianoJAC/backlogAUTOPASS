<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog · Autopass</title>
<style>
  :root{
    --bg:#0b0f19; --panel:#111828; --panel2:#182136; --panel3:#1e2a44;
    --line:#24314f; --line2:#2e3f63;
    --txt:#e9edf6; --mut:#93a0ba; --faint:#5b6882;
    --acc:#5b9dff; --acc2:#22d3aa;
    --grad:linear-gradient(135deg,#5b9dff,#22d3aa);
    --h:#2dd4bf; --t:#fbbf24; --f:#a78bfa;
    --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(91,157,255,.12), transparent 60%),
      radial-gradient(700px 400px at -10% 0%, rgba(34,211,170,.08), transparent 60%),
      var(--bg);
    color:var(--txt); min-height:100vh;
  }
  .wrap{max-width:1560px;margin:0 auto;padding:18px 20px 60px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:13px;flex:0 0 auto;
    background:var(--grad);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;color:#05121f;
    box-shadow:0 6px 20px rgba(34,211,170,.25);
  }
  .brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.3px}
  .brand .sub{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
  .save-ind{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);
    background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:999px;
    transition:.3s;
  }
  .save-ind .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:.3s}
  .save-ind.on{border-color:var(--ok);color:var(--ok)}
  .save-ind.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:16px;
  }
  .search{position:relative;flex:1;min-width:220px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
  .search input{
    width:100%;padding:9px 12px 9px 36px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;font-size:13px;outline:none;transition:.15s;
  }
  .search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,157,255,.15)}
  .search input::placeholder{color:var(--faint)}
  .toolbar select{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:9px 10px;font-size:13px;outline:none;cursor:pointer;transition:.15s;
  }
  .toolbar select:hover,.toolbar select:focus{border-color:var(--acc)}
  .spacer{flex:1 1 0}
  .btn{
    display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--acc);color:#fff;transform:translateY(-1px)}
  .btn svg{width:15px;height:15px}
  .btn.prim{background:var(--grad);border:none;color:#05121f}
  .btn.prim:hover{box-shadow:0 6px 18px rgba(34,211,170,.35)}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;transition:.15s;
  }
  .stat:hover{border-color:var(--line2);transform:translateY(-1px)}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#5b9dff)}
  .stat .num{font-size:22px;font-weight:800;line-height:1;color:var(--txt)}
  .stat .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
  .stat .tag{font-size:15px;font-weight:800;color:var(--c)}
  .progress{margin-bottom:16px}
  .progress .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:6px}
  .progress .meta b{color:var(--txt)}
  .bar{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s ease}

  /* ---------- table ---------- */
  .tab{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:72vh;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  thead th{
    position:sticky;top:0;z-index:5;background:#1a2440;color:var(--mut);
    font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;padding:11px 12px;text-align:left;
    border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;
  }
  thead th:first-child{border-top-left-radius:14px}
  thead th:last-child{border-top-right-radius:14px}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
  tbody tr:hover td{background:rgba(91,157,255,.06)}
  td[contenteditable=true]:hover{outline:1px dashed var(--line2);cursor:text}
  td[contenteditable=true]:focus{outline:2px solid var(--acc);background:#0d1526;border-radius:6px}

  /* row columns */
  .rowops{width:38px;text-align:center;padding:0!important}
  .rowops button{
    background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;
    opacity:0;transition:.15s;padding:4px;
  }
  tr:hover .rowops button{opacity:1}
  .rowops button:hover{color:var(--bad)}
  .tipo-cell{width:36px;text-align:center;font-weight:800;font-size:11px;letter-spacing:.5px}
  .tipo-cell[data-val="H"]{color:var(--h)}
  .tipo-cell[data-val="T"]{color:var(--t)}
  .tipo-cell[data-val="F"]{color:var(--f)}
  td[data-key="id"]{font-family:Consolas,monospace;font-weight:700;color:var(--acc);white-space:nowrap}
  td[data-key="desc"]{min-width:300px;line-height:1.45}
  td[data-key="mvp"]{font-weight:700;white-space:nowrap}
  td[data-key="mvp"][data-val^="MVP 1"]{color:#38bdf8}
  td[data-key="mvp"][data-val^="MVP 2"]{color:var(--f)}
  td[data-key="mvp"][data-val^="MVP 3"]{color:var(--warn)}
  td[data-key="mvp"][data-val^="MVP 4"]{color:var(--bad)}
  td[data-key="estado"]{font-weight:700;white-space:nowrap}
  td[data-key="estado"]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--ec,#5b6882);vertical-align:1px}
  td[data-key="estado"][data-val="CERRADA"]{color:var(--ok)}
  td[data-key="estado"][data-val="CERRADA"]::before{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
  td[data-key="estado"][data-val="EN CURSO"]{color:var(--warn)}
  td[data-key="estado"][data-val="EN CURSO"]::before{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
  td[data-key="estado"][data-val="PENDIENTE"]{color:var(--bad)}
  td[data-key="estado"][data-val="PENDIENTE"]::before{background:var(--bad);box-shadow:0 0 0 3px rgba(251,113,133,.15)}
  td[data-key="responsable"]{position:relative;padding-left:24px;white-space:nowrap;color:var(--txt);font-weight:500}
  td[data-key="responsable"]::before{
    content:"";position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:8px;height:8px;border-radius:50%;background:var(--rc,#5b6882);
  }
  td[data-key="finicio"],td[data-key="ffin"]{font-family:Consolas,monospace;color:var(--mut);white-space:nowrap;font-size:12px}
  td[data-key="obs"]{min-width:200px;color:var(--mut);line-height:1.4;font-size:12px}

  /* sections */
  tr.section td{
    background:linear-gradient(90deg,#0e1730,#12203f);color:var(--acc);
    font-weight:800;text-transform:uppercase;letter-spacing:.8px;font-size:12px;cursor:pointer;
    padding:12px 14px;user-select:none;border-bottom:1px solid var(--line);
  }
  tr.section td:hover{filter:brightness(1.15)}
  tr.section .chev{display:inline-block;margin-right:10px;transition:transform .2s;color:var(--acc);font-size:10px}
  tr.section.collapsed .chev{transform:rotate(-90deg)}
  tr.section .secdate{color:var(--faint);font-weight:500;margin-left:10px;letter-spacing:.3px;font-size:11px}
  tr.section .seccount{float:right;background:rgba(91,157,255,.15);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700}
  tr.row-sect-hidden{display:none}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--panel3);
    border:1px solid var(--acc);color:var(--txt);padding:12px 20px;border-radius:11px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:9px;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast .ok{color:var(--ok);font-weight:800}

  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid var(--panel)}
  ::-webkit-scrollbar-thumb:hover{background:var(--acc)}

  @media (max-width:820px){
    .toolbar .spacer{display:none}
    .stats{grid-template-columns:repeat(2,1fr)}
  }

  @media print{
    body{background:#fff;color:#111}
    .top,.toolbar,.stats,.progress,.rowops{display:none!important}
    .tab{max-height:none;border:none;overflow:visible;box-shadow:none;background:#fff}
    th{background:#eee!important;color:#333!important}
    td,th{border-color:#ccc!important}
    tr.section td{background:#eef2ff!important;color:#1a2440!important}
    tbody tr:nth-child(even) td{background:#fafafa!important}
    td[data-key="estado"]::before,td[data-key="responsable"]::before{display:none}
  }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">A</div>

    <button class="btn" id="exportCsv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>

      Restablecer
    </button>
  </section>

  <section class="stats" id="stats"></section>
  <div class="progress">
    <div class="meta"><span id="progLabel">Progreso</span><b id="progPct">0%</b></div>
    <div class="bar"><i id="progBar"></i></div>
  </div>

  <section class="tab">
    <table id="tbl">
      <thead>
        <tr>
          <th></th><th>TIPO</th><th>ID</th><th>DESCRIPCIÓN</th><th>MVP</th><th>ESTADO</th><th>RESPONSABLE</th><th>F. INICIO</th><th>F. FIN</th><th>OBSERVACIONES / ARCHIVOS</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</div>
<div class="toast" id="toast"><span class="ok">✓</span><span id="toastMsg"></span></div>

", "desc": "implementar soft-delete de usuarios con anonimizacion", "mvp": "MVP 2", "estado": "CERRADA", "responsable": "Veronica", "finicio": "02/07/26", "ffin": "02/07/26", "obs": ""}, {"kind": "row", "tipo": "H", "id": "H69", "desc": "Como usuario quiero ver numeros con separador de miles", "mvp": "MVP 2", "estado": "CERRADA", "responsable": "Diego", "finicio": "02/07/26", "ffin": "02/07/26", "obs": "FORMATNUM() CON REGEX UNIVERSAL"}, {"kind": "row", "tipo": "T", "id": "T193", "desc": "implementar separador de miles universal con formatNum()", "mvp": "MVP 2", "estado": "CERRADA", "responsable": "Diego", "finicio": "02/07/26", "ffin": "02/07/26", "obs": ""}, {"kind": "row", "tipo": "H", "id": "H70", "desc": "Como administrador quiero RBAC descentralizado", "mvp": "MVP 2", "estado": "CERRADA", "responsable": "Diego", "finicio": "18/05/26", "ffin": "18/05/26", "obs": "ROLES ADMIN/LOCAL_ADMIN/STAFF/USER"}, {"kind": "row", "tipo": "T", "id": "T194", "desc": "implementar RBAC con aislamiento de datos por sucursal", "mvp": "MVP 2", "estado": "CERRADA", "responsable": "Diego", "finicio": "18/05/26", "ffin": "18/05/26", "obs": ""}, {"kind": "row", "tipo": "H", "id": "H71", "desc": "Optimizar avisos del sistema", "mvp": "MVP 2", "estado": "CERRADA", "responsable": "Diego", "finicio": "03/07/26", "ffin": "09/07/26", "obs": ""}, {"kind": "row", "tipo": "T", "id": "T195", "desc": "mejorar los avisos, dividiendolos en 3 posibles: exito / info / error", "mvp": "MVP 2", "estado": "CERRADA", "responsable": "Diego", "finicio": "03/07/26", "ffin": "09/07/26", "obs": ""}];
const LSKEY = "backlog_autopass_v1";
const $ = s => document.querySelector(s);

let rows = [];
let filters = {q:"", tipo:"", mvp:"", estado:"", resp:""};
let saveTimer = null;

const RESP_COLORS = ["#38bdf8","#a78bfa","#f472b6","#fbbf24","#34d399","#fb7185","#60a5fa","#c084fc","#2dd4bf","#f97316"];

function clone(x){ return JSON.parse(JSON.stringify(x)); }
function saveToDb(data){
  db.set(JSON.parse(JSON.stringify(data)));
}
function onData(snap){
  const val = snap.val();
  if(val === null){
    rows = clone(DATA);
    saveToDb(rows);
    render();
    return;
  }
  const incoming = JSON.stringify(val);
  if(incoming === JSON.stringify(rows)) return;
  rows = val;
  render();
}
function load(){
  rows = clone(DATA);
  if(RTDB_ENABLED){
    $("#saveInd").innerHTML = '<span class="dot"></span> Guardado en la nube';
    db.on("value", onData);
  }
}
function persist(){
  if(RTDB_ENABLED){
    saveToDb(rows);
  } else {
    try{ localStorage.setItem(LSKEY, JSON.stringify(rows)); }catch(e){}
  }
  const el = $("#saveInd");
  el.classList.add("on");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> el.classList.remove("on"), 1200);
}
function respColor(n){
  let h = 0;
  for(const c of (n||"")) h = (h*31 + c.charCodeAt(0)) | 0;
  return RESP_COLORS[Math.abs(h) % RESP_COLORS.length];
}

function cell(td){
  td.contentEditable = "true";
  td.spellcheck = false;
  td.addEventListener("paste", e => {
    e.preventDefault();
    const t = (e.clipboardData.getData("text")||"").replace(/\r?\n/g," ");
    document.execCommand("insertText", false, t);
    persist();
  });
}

function sectionCount(idx){
  let c = 0;
  for(let i=idx+1; i<rows.length; i++){
    if(rows[i].kind === "section") break;
    if(rows[i].kind === "row") c++;
  }
  return c;
}

function mkRow(ent){
  const tr = document.createElement("tr");
  if(ent.kind === "section"){
    const td = document.createElement("td");
    td.colSpan = 10;
    tr.className = "section";
    tr.dataset.section = ent.text;
    td.title = "Click para ocultar/mostrar la sección";

    const chev = document.createElement("span");
    chev.className = "chev";
    chev.textContent = "▼";
    td.appendChild(chev);
    td.appendChild(document.createTextNode(ent.text || ""));
    if(ent.fecha){
      const d = document.createElement("span");
      d.className = "secdate";
      d.textContent = "desde " + ent.fecha;
      td.appendChild(d);
    }
    const count = document.createElement("span");
    count.className = "seccount";
    count.textContent = sectionCount(rows.indexOf(ent)) + " items";
    td.appendChild(count);
    tr.appendChild(td);

    tr.addEventListener("click", () => {
      let n = tr.nextElementSibling;
      let anyShown = false;
      while(n && !n.classList.contains("section")){
        if(!n.classList.contains("row-sect-hidden")){ anyShown = true; break; }
        n = n.nextElementSibling;
      }
      n = tr.nextElementSibling;
      while(n && !n.classList.contains("section")){
        n.classList.toggle("row-sect-hidden", anyShown);
        n = n.nextElementSibling;
      }
      tr.classList.toggle("collapsed", anyShown);
    });
    return tr;
  }

  const ops = document.createElement("td");
  ops.className = "rowops";
  const del = document.createElement("button");
  del.textContent = "✕";
  del.title = "Eliminar fila";
  del.addEventListener("click", e => {
    e.stopPropagation();
    tr.remove();
    rows = rows.filter(r => r !== ent);
    persist(); render();
  });
  ops.appendChild(del);
  tr.appendChild(ops);

  const order = ["tipo","id","desc","mvp","estado","responsable","finicio","ffin","obs"];
  order.forEach(k => {
    const td = document.createElement("td");
    if(k === "tipo") td.className = "tipo-cell";
    td.dataset.key = k;
    cell(td);
    tr.appendChild(td);
  });
  return tr;
}

function renderCell(td, ent, k){
  td.textContent = ent[k] || "";
  td.dataset.val = ent[k] || "";
  if(k === "estado"){
    const c = ent[k]==="CERRADA" ? "#34d399" : ent[k]==="EN CURSO" ? "#fbbf24" : ent[k]==="PENDIENTE" ? "#fb7185" : "#5b6882";
    td.style.setProperty("--ec", c);
  }
  if(k === "responsable") td.style.setProperty("--rc", respColor(ent[k]));
}

function build(){
  const tb = $("#tbody");
  tb.innerHTML = "";
  let prevSection = null;
  rows.forEach(ent => {
    if(ent.kind === "section"){
      prevSection = ent.text;
      const tr = mkRow(ent);
      tr.dataset.section = ent.text;
      tb.appendChild(tr);
      return;
    }
    const tr = mkRow(ent);
    tr.dataset.section = prevSection || "";
    tb.appendChild(tr);
    const tds = tr.querySelectorAll("td[data-key]");
    const order = ["tipo","id","desc","mvp","estado","responsable","finicio","ffin","obs"];
    order.forEach((k,i) => {
      const td = tds[i];
      renderCell(td, ent, k);
      td.addEventListener("input", () => {
        const v = td.textContent.trim();
        ent[k] = v;
        td.dataset.val = v;
        if(k==="tipo") td.dataset.tipo = v;
        if(k==="estado") td.style.setProperty("--ec", v==="CERRADA"?"#34d399":v==="EN CURSO"?"#fbbf24":v==="PENDIENTE"?"#fb7185":"#5b6882");
        if(k==="responsable") td.style.setProperty("--rc", respColor(v));
        persist();
      });
    });
  });
  fillFilters();
}

function applyFilters(){
  const tb = $("#tbody");
  tb.querySelectorAll("tr[data-section]").forEach(tr => {
    if(tr.classList.contains("section")) return;
    let pass = true;
    const text = tr.textContent.toLowerCase();
    if(filters.q && text.indexOf(filters.q) < 0) pass = false;
    if(filters.tipo){
      const t = tr.querySelector(".tipo-cell");
      if(!t || t.dataset.val !== filters.tipo) pass = false;
    }
    if(filters.mvp || filters.estado || filters.resp){
      const kv = {};
      tr.querySelectorAll("td[data-key]").forEach(t => kv[t.dataset.key] = t.dataset.val);
      if(filters.mvp && kv.mvp !== filters.mvp) pass = false;
      if(filters.estado && kv.estado !== filters.estado) pass = false;
      if(filters.resp && kv.responsable !== filters.resp) pass = false;
    }
    tr.style.display = pass ? "" : "none";
  });
  tb.querySelectorAll("tr.section").forEach(sr => {
    let any = false;
    let n = sr.nextElementSibling;
    while(n && !n.classList.contains("section")){
      if(n.style.display !== "none"){ any = true; break; }
      n = n.nextElementSibling;
    }
    sr.style.display = any ? "" : "none";
  });
}

function fillFilters(){
  const mvp = new Set(), est = new Set(), resp = new Set();
  rows.forEach(r => {
    if(r.kind !== "row") return;
    if(r.mvp) mvp.add(r.mvp);
    if(r.estado) est.add(r.estado);
    if(r.responsable) resp.add(r.responsable);
  });
  fillSel($("#fMvp"), mvp, filters.mvp);
  fillSel($("#fEstado"), est, filters.estado);
  fillSel($("#fResp"), resp, filters.resp);
}
function fillSel(sel, set, keep){
  const labels = {fMvp:"MVP: todos", fEstado:"Estado: todos", fResp:"Responsable: todos"};
  sel.innerHTML = '<option value="">'+labels[sel.id]+'</option>';
  [...set].sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    if(v === keep) o.selected = true;
    sel.appendChild(o);
  });
}

function updateStats(){
  const H = rows.filter(r=>r.kind==="row"&&r.tipo==="H").length;
  const T = rows.filter(r=>r.kind==="row"&&r.tipo==="T").length;
  const F = rows.filter(r=>r.kind==="row"&&r.tipo==="F").length;
  const cer = rows.filter(r=>r.kind==="row"&&r.estado==="CERRADA").length;
  const pen = rows.filter(r=>r.kind==="row"&&r.estado==="PENDIENTE").length;
  const cur = rows.filter(r=>r.kind==="row"&&r.estado==="EN CURSO").length;
  const total = H+T+F;
  const pct = total ? Math.round(cer/total*100) : 0;

  $("#countLabel").textContent = "Backlog operativo · Autopass · " + total + " items";
  $("#stats").innerHTML =
    '<div class="stat" style="--c:#5b9dff"><span class="tag">'+total+'</span><div><div class="num" style="display:none"></div><div class="lbl">Items</div></div></div>'+
    '<div class="stat" style="--c:#2dd4bf"><span class="tag">H</span><div><div class="num">'+H+'</div><div class="lbl">Historias</div></div></div>'+
    '<div class="stat" style="--c:#fbbf24"><span class="tag">T</span><div><div class="num">'+T+'</div><div class="lbl">Tareas</div></div></div>'+
    '<div class="stat" style="--c:#a78bfa"><span class="tag">F</span><div><div class="num">'+F+'</div><div class="lbl">Funcionalidades</div></div></div>'+
    '<div class="stat" style="--c:#34d399"><span class="tag">✓</span><div><div class="num">'+cer+'</div><div class="lbl">Cerradas</div></div></div>'+
    '<div class="stat" style="--c:#fbbf24"><span class="tag">◔</span><div><div class="num">'+cur+'</div><div class="lbl">En curso</div></div></div>'+
    '<div class="stat" style="--c:#fb7185"><span class="tag">◷</span><div><div class="num">'+pen+'</div><div class="lbl">Pendientes</div></div></div>';
  $("#progPct").textContent = pct + " completado";
  $("#progBar").style.width = pct + "%";
}

function addRow(){
  const ent = {kind:"row", tipo:"T", id:"", desc:"", mvp:"MVP 1", estado:"PENDIENTE", responsable:"", finicio:"", ffin:"", obs:""};
  rows.push(ent);
  persist(); render();
  const lastRow = $("#tbody").querySelector("tr:last-child");
  if(lastRow){
    const td = lastRow.querySelector('td[data-key="desc"]');
    if(td) td.focus();
  }
}

function csvCell(v){
  v = (v||"").replace(/\r?\n/g," ");
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function exportCsv(){
  let out = "\uFEFFTIPO,ID,DESCRIPCIÓN,MVP,ESTADO,RESPONSABLE,FECHA INICIO,FECHA FIN,OBSERVACIONES / ARCHIVOS RELACIONADOS\r\n";
  rows.forEach(r => {
    if(r.kind === "section"){
      out += csvCell(r.text) + "\r\n";
    } else {
      out += [r.tipo,r.id,r.desc,r.mvp,r.estado,r.responsable,r.finicio,r.ffin,r.obs].map(csvCell).join(",") + "\r\n";
    }
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"text/csv;charset=utf-8"}));
  a.download = "backlog_autopass.csv";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("CSV exportado");
}

function toast(msg){
  $("#toastMsg").textContent = msg;
  const t = $("#toast");
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.classList.remove("show"), 2000);
}

function reset(){
  if(!confirm("¿Restablecer a los datos originales? Se perderán los cambios actuales.")) return;
  const d = clone(DATA);
  if(RTDB_ENABLED){
    rows = d;
    saveToDb(d);
  } else {
    localStorage.removeItem(LSKEY);
    rows = d;
  }
  render();
  toast("Datos restablecidos");
}

function render(){
  build();
  applyFilters();
  updateStats();
}

$("#q").addEventListener("input", e => { filters.q = e.target.value; applyFilters(); });
$("#fTipo").addEventListener("change", e => { filters.tipo = e.target.value; applyFilters(); });
$("#fMvp").addEventListener("change", e => { filters.mvp = e.target.value; applyFilters(); });
$("#fEstado").addEventListener("change", e => { filters.estado = e.target.value; applyFilters(); });
$("#fResp").addEventListener("change", e => { filters.resp = e.target.value; applyFilters(); });
$("#addRow").addEventListener("click", addRow);
$("#exportCsv").addEventListener("click", exportCsv);
$("#resetBtn").addEventListener("click", reset);
$("#print").addEventListener("click", () => window.print());

load(); render();
if(!RTDB_ENABLED) toast("Sin Firebase configurado — modo local (localStorage)");
</script>
</body>
</html>
